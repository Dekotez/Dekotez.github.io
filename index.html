<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Своя игра</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Своя игра</h1>
        </header>

        <main id="game-board">
            <!-- Категория 1: Литература -->
            <div class="category">
                <h2>Математика</h2>
                <div class="question" data-value="100">100</div>
                <div class="question" data-value="200">200</div>
                <div class="question" data-value="300">300</div>
                <div class="question" data-value="400">400</div>
                <div class="question" data-value="500">500</div>
            </div>

            <!-- Категория 2: История -->
            <div class="category">
                <h2>История</h2>
                <div class="question" data-value="100">100</div>
                <div class="question" data-value="200">200</div>
                <div class="question" data-value="300">300</div>
                <div class="question" data-value="400">400</div>
                <div class="question" data-value="500">500</div>
            </div>

            <!-- Категория 3: Наука -->
            <div class="category">
                <h2>Физика</h2>
                <div class="question" data-value="100">100</div>
                <div class="question" data-value="200">200</div>
                <div class="question" data-value="300">300</div>
                <div class="question" data-value="400">400</div>
                <div class="question" data-value="500">500</div>
            </div>

            <!-- Кот в мешке 1 -->
            <div class="category special">
                <h2>Кот в мешке</h2>
                <div class="question special" data-value="250">Вопрос 1</div>
                <div class="question special" data-value="250">Вопрос 2</div>
            </div>

        <!-- Модальное окно с вопросом -->
        <div id="question-modal" class="hidden">
            <div class="modal-content">
                <p id="question-text"></p>
                <input type="text" id="answer-input" placeholder="Ваш ответ...">
                <button onclick="checkAnswer()">Проверить</button>
                <button onclick="closeModal()">Закрыть</button>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
