<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Своя игра</title>
    <link rel="stylesheet" href="style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
    <div class="container">
        <header>
            <h1>Своя игра</h1>
        </header>

        <main id="game-board">
            <!-- Категории и вопросы -->
            <div class="category">
                <h2>Математика</h2>
                <div class="question" data-value="100">100</div>
                <div class="question" data-value="200">200</div>
                <div class="question" data-value="300">300</div>
                <div class="question" data-value="400">400</div>
                <div class="question" data-value="500">500</div>
            </div>

            <div class="category">
                <h2>История</h2>
                <div class="question" data-value="100">100</div>
                <div class="question" data-value="200">200</div>
                <div class="question" data-value="300">300</div>
                <div class="question" data-value="400">400</div>
                <div class="question" data-value="500">500</div>
            </div>

            <div class="category">
                <h2>Физика</h2>
                <div class="question" data-value="100">100</div>
                <div class="question" data-value="200">200</div>
                <div class="question" data-value="300">300</div>
                <div class="question" data-value="400">400</div>
                <div class="question" data-value="500">500</div>
            </div>

            <div class="category">
                <h2>Спорт</h2>
                <div class="question" data-value="100">100</div>
                <div class="question" data-value="200">200</div>
                <div class="question" data-value="300">300</div>
                <div class="question" data-value="400">400</div>
                <div class="question" data-value="500">500</div>
            </div>

            <div class="category">
                <h2>Музыка</h2>
                <div class="question" data-value="100">100</div>
                <div class="question" data-value="200">200</div>
                <div class="question" data-value="300">300</div>
                <div class="question" data-value="400">400</div>
                <div class="question" data-value="500">500</div>
            </div>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
